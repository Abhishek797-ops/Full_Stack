<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family:"Brownie Stencil" ;
            src: url("brownie-stencil-font/BrownieStencil-8O8MJ.ttf");
        }
        p{
            font-family:Brownie Stencil ;
        }
        #myId{
            color: green;
        }
        .myclass{
            color: red;
        }
        input[type="email"]{
            border-radius: 5px;
        }
        input[type="password"]{
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <p id="myId">This is a paragraph with the custom font.</p>
    <p class="myclass">This is another paragraph with the custom font.</p>
    <input type="email" placeholder="Email"></br>
    <input type="password" placeholder="Password">
</body>
</html>
