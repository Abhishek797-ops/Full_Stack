<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Villains</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background: #000;
            font-family: Arial, sans-serif;
        }
        .main-page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: black;
            background-size: cover;
            background-position: center;
        }

        .main-page h1 {
            color: white;
            font-size: clamp(50px, 9vw, 130px);
            font-weight: 900;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow:
                0 5px 15px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 0, 0, 0.5);
        }
        .container {
            width: 100%;
        }

        .box {
            width: 100%;
            height: 100vh;

            position: sticky;
            top: 0;

            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;
        }
        .box::after {
            content: "";

            position: absolute;

            inset: 0;

            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.35)
            );

            pointer-events: none;
        }

        

        @media (max-width: 768px) {

            .main-page h1 {
                font-size: 55px;
                letter-spacing: 3px;
            }

            .box {
                height: 100vh;
            }
        }
    </style>
</head>

<body>

   

    <section class="main-page">

        <h1>
            Spider-Man<br>
            Villains
        </h1>

        <div class="scroll-down">
            Scroll Down ↓
        </div>

    </section>


   

    <div class="container">

        

        <div class="box" id="box1">
            <img
                src="https://www.hollywoodreporter.com/wp-content/uploads/2017/07/sm1_greengoblin_8.jpg?w=800"
                alt="Green Goblin">
        </div>


       

        <div class="box" id="box2">
            <img
                src="https://i.ytimg.com/vi/g5kkEFF6MlA/mqdefault.jpg"
                alt="Spider-Man Villain">
        </div>


        

        <div class="box" id="box3">
            <img
                src="https://deadline.com/wp-content/uploads/2020/12/MCDSPID_EC082-e1607456910363.jpg"
                alt="Spider-Man Villain">
        </div>


       

        <div class="box" id="box4">
            <img
                src="https://nerdist.com/wp-content/uploads/2019/01/spider-man-far-from-home-mysterio.jpg"
                alt="Mysterio">
        </div>


        

        <div class="box" id="box5">
            <img
                src="https://www.hollywoodreporter.com/wp-content/uploads/2017/07/sm1_greengoblin_8.jpg?w=800"
                alt="Green Goblin">
        </div>

    </div>

</body>
</html>
