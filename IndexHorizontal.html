<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Villains</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .main-page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }

        .main-page h1 {
            color: white;
            font-size: clamp(50px, 9vw, 130px);
            font-weight: 900;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow:
                0 5px 15px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 0, 0, 0.5);
        }

        .horizontal-section {
            width: 100%;
            
            height: 600vh;
            position: relative;

            view-timeline-name: --villains;
            view-timeline-axis: block;
        }

        .sticky-container {
            width: 100%;
            height: 100vh;

            position: sticky;
            top: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .container {
            display: inline-flex;
            align-items: center;

            width: max-content;
            height: 80vh;

            gap: 25px;
        }

        .box {
            width: 90vw;
            min-width: 90vw;
            height: 80vh;

            flex-shrink: 0;

            position: relative;
            overflow: hidden;

            border-radius: 18px;

            animation-timing-function: ease;
            animation-fill-mode: both;

            animation-timeline: --villains;
        }

        .box img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;

            border-radius: 18px;
        }

        .box::after {
            content: "";

            position: absolute;
            inset: 0;

            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.4)
            );

            pointer-events: none;
        }

        
        .box:nth-child(2),
        .box:nth-child(3),
        .box:nth-child(4),
        .box:nth-child(5) {
            margin-left: calc(-90vw - 25px);
            transform: translateX(calc(90vw + 25px));
            animation-name: destack;
        }

        @keyframes destack {
            from {
                transform: translateX(calc(90vw + 25px));
            }

            to {
                transform: translateX(0);
            }
        }

    
        .box:nth-child(2) {
            animation-range: contain 0% contain 25%;
        }

        .box:nth-child(3) {
            animation-range: contain 25% contain 50%;
        }

        .box:nth-child(4) {
            animation-range: contain 50% contain 75%;
        }

        .box:nth-child(5) {
            animation-range: contain 75% contain 100%;
        }

        @media (max-width: 768px) {

            .main-page h1 {
                font-size: 55px;
                letter-spacing: 3px;
            }

            .container {
                gap: 15px;
            }

            .box {
                width: 90vw;
                min-width: 90vw;
                height: 75vh;
            }

            .box:nth-child(2),
            .box:nth-child(3),
            .box:nth-child(4),
            .box:nth-child(5) {
                margin-left: calc(-90vw - 15px);
                transform: translateX(calc(90vw + 15px));
            }

            @keyframes destack {
                from {
                    transform: translateX(calc(90vw + 15px));
                }

                to {
                    transform: translateX(0);
                }
            }
        }
    </style>
</head>

<body>

    <section class="main-page">

        <h1>
            Spider-Man<br>
            Villains
        </h1>

    </section>

    <section class="horizontal-section">

        <div class="sticky-container">

            <div class="container">

                <div class="box">
                    <img
                        src="https://www.hollywoodreporter.com/wp-content/uploads/2017/07/sm1_greengoblin_8.jpg?w=800"
                        alt="Green Goblin"
                    >
                </div>

                <div class="box">
                    <img
                        src="https://i.ytimg.com/vi/g5kkEFF6MlA/mqdefault.jpg"
                        alt="Spider-Man Villain"
                    >
                </div>

                <div class="box">
                    <img
                        src="https://deadline.com/wp-content/uploads/2020/12/MCDSPID_EC082-e1607456910363.jpg"
                        alt="Spider-Man Villain"
                    >
                </div>

                <div class="box">
                    <img
                        src="https://nerdist.com/wp-content/uploads/2019/01/spider-man-far-from-home-mysterio.jpg"
                        alt="Mysterio"
                    >
                </div>

                <div class="box">
                    <img
                        src="https://www.hollywoodreporter.com/wp-content/uploads/2017/07/sm1_greengoblin_8.jpg?w=800"
                        alt="Green Goblin"
                    >
                </div>

            </div>

        </div>

    </section>

</body>
</html>
