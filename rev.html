<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: grid;
      outline: 1px solid black;
      grid-template-areas: 
      "box1 box1 box2"
      "box1 box1 box2"
      "box3 box4 box5"
      "box3 box4 box5"
      "box3 box6 box5"
      "box7 box6 box5";
    }
    .container>div{
      font-size: 40px;
      outline: 1px dashed  black;
    }
    .container2{
        height: 500px;
        width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      outline: 1px solid black;
    }
    .container2>div{
      font-size: 40px;
      outline: 1px dashed black;
    }
    #box1{
        grid-column-start:1;
        grid-column-end:3;
        grid-row-start:1;
        grid-row-end:3;
    }
    #box6{
        background-color: grey;
        grid-column-start:2;
        grid-column-end:3;
        grid-row-start:2;
        grid-row-end:3;
        z-index:2;
    }
  </style>
</head>
<body>
      <div class="container">
        <div style="grid-area: box1;">1</div>
        <div style="grid-area: box2;">2</div>
        <div style="grid-area: box3;">3</div>
        <div style="grid-area: box4;">4</div>
        <div style="grid-area: box5;">5</div>
        <div style="grid-area: box6;">6</div>
        <div style="grid-area: box7;">7</div>
      </div>
      <br>
      <br>
      <div class="container2">
        <div id="box1">1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div id="box6">6</div>
      </div>
</body>
</html>
